spec_version: "0.1.0"
name: claude-agents
version: 1.0.0
description: >
  A curated collection of seven specialised Claude Code sub-agents that drop
  into any project via `.claude/agents/`. Covers the full dev lifecycle: code
  refactoring, security auditing, frontend design, content writing, PRD
  authoring, project task planning, and vibe-led application coaching.
author: iannuttall
license: MIT

model:
  preferred: anthropic:claude-sonnet-4-6

skills:
  - code-refactorer
  - security-auditor
  - frontend-designer
  - content-writer
  - prd-writer
  - project-task-planner
  - vibe-coding-coach

runtime:
  max_turns: 50

compliance:
  risk_tier: standard
  supervision:
    human_in_the_loop: destructive
    kill_switch: true
  recordkeeping:
    audit_logging: false
  data_governance:
    pii_handling: none
